<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../favicon.ico" sizes="any">
<title>Admin — NBR Play</title>
<style>
  :root { color-scheme: dark; --bg: #0E0E0E; --panel: #15181C; --panel2: #1C2026; --line: #2A3038; --text: #D6D6D6;
          --muted: #8D96A0; --accent: #66D9FF; --ok: #4ADE80; --warn: #F5B942; --bad: #F87171; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
  header img { width: 36px; height: 36px; }
  header h1 { font-size: 18px; margin: 0; color: #fff; flex: 1; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin: 0 0 16px; }
  .center { max-width: 420px; margin: 40px auto; }
  h2 { font-size: 17px; color: #fff; margin: 0 0 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); color: #fff; font: inherit; }
  button { padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); color: #fff; font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #08131A; font-weight: 700; }
  button.danger { border-color: var(--bad); color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .grow { flex: 1; min-width: 160px; }
  .msg { margin: 10px 0 0; font-size: 14px; }
  .msg.err { color: var(--bad); } .msg.ok { color: var(--ok); }
  nav.tabs { display: flex; gap: 6px; overflow-x: auto; margin: 0 0 16px; }
  nav.tabs button { white-space: nowrap; border-radius: 999px; }
  nav.tabs button.active { background: var(--accent); color: #08131A; border-color: var(--accent); font-weight: 700; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .stat { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .stat b { display: block; font-size: 24px; color: #fff; }
  .stat span { font-size: 13px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  tr.click { cursor: pointer; } tr.click:hover td { background: var(--panel2); }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); color: var(--muted); }
  .tag.ok { color: var(--ok); border-color: var(--ok); } .tag.bad { color: var(--bad); border-color: var(--bad); }
  .tag.warn { color: var(--warn); border-color: var(--warn); } .tag.acc { color: var(--accent); border-color: var(--accent); }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--muted); word-break: break-all; }
  .muted { color: var(--muted); }
  .pager { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 10px; font-size: 13px; color: var(--muted); }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 18px; width: min(680px, calc(100vw - 24px)); max-height: calc(100vh - 40px); }
  dialog::backdrop { background: rgba(0, 0, 0, .7); }
  .qr { background: #fff; padding: 10px; border-radius: 8px; width: 220px; height: 220px; margin: 10px auto; display: block; }
  /* Celular: tabelas viram cartões, cada célula com o seu rótulo. */
  @media (max-width: 720px) {
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tr { border: 1px solid var(--line); border-radius: 10px; margin: 0 0 10px; padding: 6px 4px; }
    td { border: 0; padding: 4px 8px; }
    td[data-label]::before { content: attr(data-label) ": "; color: var(--muted); font-size: 12px; }
  }
</style>
</head>
<body>
<header>
  <img src="../logo.png" alt="">
  <h1>NBR Play · Admin</h1>
  <button id="logout" hidden>Sair</button>
</header>
<main id="app"><p class="muted">Carregando…</p></main>
<dialog id="dlg"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="admin.js"></script>
</body>
</html>
