name: Testes do app

# Roda os testes unitários a cada push e pull request. Antes só o release (tag) testava: um erro
# aparecia na hora de publicar. Sem segredos: sem API do Telegram, o app compila em modo simulado.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: "test-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Testes unitários
        run: bash ./gradlew testDebugUnitTest

      - name: Relatório dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: app/build/reports/tests/testDebugUnitTest
